version: '3.8'

services:
  extension-backend:
    build:
      context: ./extension
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - QR_DECODER_URL=http://qr-decoder:5001
    depends_on:
      - qr-decoder
    volumes:
      - ./NLP:/app/../NLP:ro
    container_name: unscamable-extension

  qr-decoder:
    build:
      context: ./ocr-scam-guard
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - QR_DECODER_PORT=5001
    container_name: unscamable-qr-decoder

networks:
  default:
    name: unscamable-network
