version: '3.8'

services:
  extension-backend:
    build:
      context: ./extension
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - OCR_SERVICE_URL=http://ocr-service:5001
    depends_on:
      - ocr-service
    volumes:
      - ./NLP:/app/../NLP:ro
    container_name: unscamable-extension

  ocr-service:
    build:
      context: ./ocr-scam-guard
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - OCR_PORT=5001
    container_name: unscamable-ocr

networks:
  default:
    name: unscamable-network
